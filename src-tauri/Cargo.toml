[package]
name = "soundboard"
version = "0.3.0"
description = "Soundboard: sets of sound tiles to play live, with fades, MIDI, OSC and links"
authors = ["ZainadosRepo"]
edition = "2021"
publish = false

[lib]
name = "soundboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
soundboard-core = { path = "../crates/soundboard-core" }
cpal = "0.15.3"
midir = "0.10.4"
rubato = "0.16.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
symphonia = { version = "0.5.5", features = ["all"] }
tauri = { version = "2.11.3", features = [] }
tauri-plugin-deep-link = "2.6"
tauri-plugin-dialog = "2.8"
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-single-instance = { version = "2.5", features = ["deep-link"] }
tauri-plugin-window-state = "2.5"
tauri-plugin-updater = "2.14"

[dev-dependencies]
tempfile = "3"
