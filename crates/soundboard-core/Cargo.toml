[package]
name = "soundboard-core"
version = "0.1.0"
description = "Sound sets, playback rules, MIDI, OSC and links of Soundboard, without audio or UI"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "2.6", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
